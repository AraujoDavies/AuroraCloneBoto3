# Exemplo: copie para docker-compose.yml
# Imagem local: docker build -t aurora-clone .
#
# Pipeline agendado (container sempre online):
#   docker compose up -d aurora-scheduler
#   docker compose logs -f aurora-scheduler

services:
  aurora-scheduler:
    image: aurora-clone
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      # Diário 03:00:        0 3 * * *
      # Semanal dom 03:00:   0 3 * * 0
      # Mensal dia 1 03:00:  0 3 1 * *
      # https://crontab.guru/ for more information
      SCHEDULE_CRON: "0 3 * * *"
      SCHEDULE_COMMAND: "make PYTHON=python pipeline"
    command: ["python", "scheduler.py"]
